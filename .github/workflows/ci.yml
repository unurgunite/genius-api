name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ 3.0, 3.1, 3.2, 3.3, 3.4, 4.0 ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Bundle install with compatible nokogiri
        run: |
          gem install bundler
          bundle install || (bundle update nokogiri --conservative && bundle install)

      - name: RSpec
        run: bundle exec rspec
