---
name: CI

on:
  push:
    branches: [master, v*]
  pull_request:
    branches: [master, v*]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']

    steps:
      - uses: actions/checkout@v4

      # Remove pre-installed Ruby 4.0 (broken on ubuntu-latest)
      - name: Remove pre-installed Ruby ${{ matrix.ruby }}
        if: matrix.ruby == '4.0'
        run: rm -rf /opt/hostedtoolcache/Ruby/4.0*

      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install RBS collection
        run: bundle exec rbs collection install

      - name: RuboCop
        run: bundle exec rubocop

      - name: RSpec
        run: bundle exec rspec

      - name: RBS validate
        run: bundle exec rbs validate

      - name: Steep check
        run: bundle exec steep check
